AWSTemplateFormatVersion: "2010-09-09"
Description: "WORK4 EC2 Test Resource Template"
# Region: ap-northeast-1 (Tokyo)

# ↓パラメーター
Parameters:
  ProjectName:
    Description: Project name for resource name
    Type: String
    Default: HarukazeElec-TestResourceProject
  # AZ
  AvailabilityZone:
    Description: Possible to Select AZ. Tokyo-A or C
    Type: String
    Default: ap-northeast-1a
    AllowedValues:
      - ap-northeast-1a
      - ap-northeast-1c
      - ap-northeast-1d
  # VPC
  VpcCidr:
    Description: CIDR block for VPC
    Type: String
    Default: 10.0.0.0/16
  # パブリックサブネット
  SubnetCidr:
    Description: CIDR block for subnet
    Type: String
    Default: 10.0.1.0/24
  # EC2
  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t3.micro
  AmiId:
    Description: Amazon Linux 2023 AMI ID
    Type: String
    Default: ami-0c051224e18c11f2e
  # キーペア
  KeyName:
    Description: EC2 key pair name
    Default: Harukaze-test-key
    Type: AWS::EC2::KeyPair::KeyName
# ↑パラメーター

# ↓リソース
Resources:
  # VPC
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-VPC"
  # サブネット
  MySubNet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref SubnetCidr
      MapPublicIpOnLaunch: true
  # インターネットゲートウェイ1
  MyInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-IGW"
  # インターネットゲートウェイ2 VPCとアタッチ
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref MyInternetGateway
  # ルートテーブル1
  MyRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-RouteTable"
  # ルートテーブル2 サブネットとの関連付け
  MySubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref MyRouteTable
      SubnetId: !Ref MySubNet
  # ルートテーブル3 IGWへのルーティング設定
  MyRouting:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref MyRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref MyInternetGateway
  # セキュリティグループ
  MySecurityGrp:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} Security Group"
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          ToPort: 22
          FromPort: 22
          CidrIp: 0.0.0.0/0
      # SecurityGroupEgress: はデフォルト
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-SecurityGrp"
  # EC2インスタンス
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: 
        - !Ref MySecurityGrp
      SubnetId: !Ref MySubNet
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-EC2"
# ↑リソース

# ↓アウトプット
Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref MyVPC
    Export:
      Name: !Sub "${ProjectName}-VPC-ID"
  SubnetId:
    Description: Subnet ID
    Value: !Ref MySubNet
    Export:
      Name: !Sub "${ProjectName}-Subnet-ID"
  InternetGatewayId:
    Description: InternetGateway ID
    Value: !Ref MyInternetGateway
    Export:
      Name: !Sub "${ProjectName}-InternetGateway-ID"
  SecurityGrpId:
    Description: Security Group ID
    Value: !Ref MySecurityGrp
    Export:
      Name: !Sub "${ProjectName}-SecurityGrp-ID"
  EC2Id:
    Description: EC2 ID
    Value: !Ref MyInstance
    Export:
      Name: !Sub "${ProjectName}-EC2-ID"
  EC2PublicIPaddress:
    Description: EC2 Public IP Address
    Value: !GetAtt MyInstance.PublicIp
    Export:
      Name: !Sub "${ProjectName}-EC2-Pub-IP"
  EC2privateIPaddress:
    Description: EC2 Private IP Address
    Value: !GetAtt MyInstance.PrivateIp
    Export:
      Name: !Sub "${ProjectName}-EC2-private-IP"
# ↑アウトプット










